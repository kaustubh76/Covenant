# Covenant's backend on Render: Playground chains with real writes (backend/). The web app stays on Vercel.
# This Blueprint creates the service; the relayer's key (RELAYER_PRIVATE_KEY) is then set as a secret in Render, never here.
services:
  - type: web
    name: covenant-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - deployments/playground.json
        - deployments/playground.runtime.json
        - Dockerfile
        - .dockerignore
        - deployments/84532.json
        - deployments/84532.runtime.json
        - web/src/chain/abi.generated.ts
        - web/src/chain/price.ts
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://covenant-uhi11.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: MAX_CHAINS
        value: "4"
